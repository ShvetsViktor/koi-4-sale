{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up | Koi4Sale{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row">
    <div class="col-12 col-md-8 col-lg-6">
      <h1>Create an Account</h1>

      <form method="post">
        {% csrf_token %}
        {{ form | crispy }}

        <button type="submit" class="btn btn-primary">
          Sign Up
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
