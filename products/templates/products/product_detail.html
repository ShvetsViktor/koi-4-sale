<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ product.name }} | Koi4Sale</title>
  </head>
  <body>
    <main>
        <div class="product-images">
            {% for image in product.images.all %}
            <img src="{{ image.image.url }}" alt="{{ product.name }}"></img>
            {% endfor %}
        </div>
        <h1>{{ product.name }}</h1>
        <p>Variety: {{ product.variety }}</p>
        <p>Price: £{{ product.price }}</p>
        <p>Size: {{ product.size }} cm</p>
        <p>Age: {{ product.age }} years</p>
        <p>{{ product.description }}</p>
    </main>
  </body>
</html>
