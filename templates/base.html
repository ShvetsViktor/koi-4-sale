{% load static %}

<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO metadata -->
    <meta
      name="description"
      content="{% block meta_description %}Browse our collection of Japanese koi for sale in the UK. Explore individual koi, compare prices and request a reservation online.{% endblock %}"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#111827" />

    <!-- Open Graph metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Koi4Sale" />
    <meta
      property="og:title"
      content="{% block og_title %}Koi4Sale | Japanese Koi for Sale{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}Discover Japanese koi for sale in the UK. Browse available fish and submit a reservation request online.{% endblock %}"
    />

    <title>{% block title %}Koi4Sale{% endblock %}</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="{% static 'favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">

    <!-- Bootstrap 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    {% include "includes/header.html" %}

    <main id="main-content">
      {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shopping cart -->
    <script src="{% static 'js/cart.js' %}"></script>
    <script>
      updateCartCount();
    </script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
